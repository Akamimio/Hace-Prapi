<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c36"><meta name="description" content="Hace Prapi: time your shots and beat the moving goalkeeper."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Hace Prapi</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><h1>HACE PRAPI</h1><p>Penalty Challenge</p></header><section class="score"><span>GOALS <b id="goals">0</b></span><span>SHOTS <b id="shots">0</b></span><span>BEST <b id="best">0</b></span></section><div class="arena"><canvas id="game" width="420" height="600" aria-label="Football penalty game"></canvas><div id="message" class="message">Tap or drag to aim. Release to shoot!</div></div><div class="controls"><button id="shoot">SHOOT</button><button id="restart" class="secondary">NEW GAME</button><button id="sound" class="secondary" aria-label="Toggle sound">SOUND ON</button></div><p class="hint">Move the target by tapping or dragging. Score past the moving goalkeeper. 10 shots per round.</p></main><script src="game.js" defer></script></body></html>
